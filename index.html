<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Marcador en vivo, tabla de posiciones, goleadores y llaves de la Copa Decembrina de Hinchas en Tesalia, Huila.">
<meta property="og:title" content="Copa Decembrina de Hinchas · En vivo">
<meta property="og:description" content="Sigue los partidos en vivo desde la Cancha Olímpica de Tesalia.">
<title>Copa Decembrina de Hinchas · En vivo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%2338D9FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css?v=1.5">
</head>
<body>
<div class="app">
  <header class="cabecera">
    <div class="fila">
      <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="marca" id="marca">Copa Decembrina</span><span class="version">v1.5</span></span>
      <button class="icono-btn" id="compartir" aria-label="Compartir enlace"></button>
    </div>
    <h1 id="titulo">En vivo</h1>
    <p class="sub" id="sede">Cancha Olímpica de Fútbol 11 · Tesalia, Huila</p>
  </header>
  <main class="contenido" id="vista" aria-live="polite">
    <p class="vacio">Cargando…</p>
  </main>
  <footer class="pie">Copa Decembrina de Hinchas · Tesalia · <b>versión 1.5</b> · <a href="#tv">Modo pantalla grande</a></footer>
  <nav class="nav" aria-label="Secciones" id="nav" style="--cols:4">
    <a href="#vivo" data-ruta="vivo"><span data-ic="vivo"></span>En vivo</a>
    <a href="#posiciones" data-ruta="posiciones"><span data-ic="tabla"></span>Posiciones</a>
    <a href="#estadisticas" data-ruta="estadisticas"><span data-ic="estadisticas"></span>Estadísticas</a>
    <a href="#llaves" data-ruta="llaves"><span data-ic="llaves"></span>Llaves</a>
  </nav>
</div>
<script>
  // Muestra en pantalla cualquier error de carga (para saber qué falla)
  function copaFallo(m){var v=document.getElementById('vista');if(v)v.innerHTML='<section class="tarjeta" style="padding:18px;border-color:#F2B8B8"><h2 style="color:#C42B2B">No se pudo cargar</h2><p class="sub" style="margin-top:8px">'+String(m).replace(/</g,'&lt;')+'</p></section>';}
  window.addEventListener('error',function(e){copaFallo(e.message||'Error al cargar los archivos');});
  window.addEventListener('unhandledrejection',function(e){copaFallo((e.reason&&e.reason.message)||e.reason);});
</script>
<script type="module" src="js/publico.js?v=1.5"></script>
</body>
</html>
