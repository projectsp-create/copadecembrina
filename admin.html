<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070C18">
<meta name="robots" content="noindex">
<title>Copa Decembrina · Administración</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%2338D9FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css?v=3">
</head>
<body>
<div class="app admin">
  <main class="contenido" id="vista" style="padding-top:20px">
    <p class="vacio">Cargando…</p>
  </main>
  <nav class="nav oculto" aria-label="Secciones de administración" id="nav"></nav>
</div>
<script>
  // Muestra en pantalla cualquier error de carga (para saber qué falla)
  function copaFallo(m){var v=document.getElementById('vista');if(v)v.innerHTML='<section class="tarjeta" style="padding:18px;border-color:#5A1E1A"><h2 style="color:#FF7A70">No se pudo cargar</h2><p class="sub" style="margin-top:8px">'+String(m).replace(/</g,'&lt;')+'</p></section>';}
  window.addEventListener('error',function(e){copaFallo(e.message||'Error al cargar los archivos');});
  window.addEventListener('unhandledrejection',function(e){copaFallo((e.reason&&e.reason.message)||e.reason);});
</script>
<script type="module" src="js/admin.js?v=3"></script>
</body>
</html>
